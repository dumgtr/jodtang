services:
  postgres:
    image: postgres:16-alpine
    container_name: jodtang_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jodtang_db
      POSTGRES_USER: postgres
      # Development-only local credential. Never reuse it in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jodtang_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
